<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOICE v2 - Cryptographic Peer Network</title>
    <style>
        :root { 
            --primary: #00ff66; 
            --admin-color: #00bcd4; 
            --bg: #090b0e; 
            --card: #13171f; 
            --text: #f0f4f8; 
            --border: #222936;
        }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Navigation */
        .navbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
        .brand { font-size: 22px; font-weight: 8px; letter-spacing: 1px; margin: 0; }
        .brand span { color: var(--primary); font-weight: bold; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        
        /* Notifications */
        .bell-icon { cursor: pointer; font-size: 22px; position: relative; user-select: none; }
        .badge-count { position: absolute; top: -5px; right: -5px; background: #ff3b30; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; display: none; font-weight: bold; }
        .notification-dropdown { display: none; position: absolute; right: 0; top: 40px; background: #1a202c; border: 1px solid var(--border); width: 320px; z-index: 100; border-radius: 8px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .notif-title { font-size: 13px; margin: 0 0 10px 0; color: var(--admin-color); border-bottom: 1px solid var(--border); padding-bottom: 8px; font-weight: bold; }
        
        /* Layout Grid */
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); padding: 22px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border); }
        
        /* UI Typography & Inputs */
        h3 { color: var(--primary); margin-top: 0; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid var(--border); background: #1c2331; color: #fff; box-sizing: border-box; font-size: 14px; transition: all 0.2s ease; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; background: #222b3d; }
        
        /* Buttons & Badges */
        button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        button:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .btn-secondary { background: #2d3748; color: #fff; }
        .btn-secondary:hover { background: #4a5568; }
        .btn-logout { background: #ff3b30; color: #fff; width: auto; padding: 6px 12px; font-size: 12px; border-radius: 4px; display: none; margin-left: 10px; text-transform: none; }
        .delete-btn { background: #e53e3e; color: white; width: auto; padding: 4px 10px; font-size: 11px; float: right; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; margin: 0; text-transform: uppercase; }
        
        .admin-badge { background: var(--admin-color); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 8px; font-weight: bold; display: inline-block; }
        .user-badge { background: #1c2331; color: var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 13px; border: 1px solid var(--border); font-family: monospace; }
        
        /* Messaging Component */
        .chat-box { height: 250px; overflow-y: auto; background: #0b0d12; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .msg { margin-bottom: 12px; padding: 10px; border-radius: 6px; background: #1c2331; font-size: 14px; border: 1px solid var(--border); }
        .msg-meta { color: #718096; font-size: 11px; display: block; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Main Dashboard Header -->
    <div class="navbar">
        <h2 class="brand">🎙️ VOICE <span>v2</span></h2>
        <div class="nav-right">
            <div id="user-status-container">
                <span class="user-badge" style="color: #718096;">Session Locked</span>
            </div>
            <button id="logout-action-btn" class="btn-logout" onclick="logoutSession()">Log Out</button>
            
            <!-- Secure Broadcast Notification System -->
            <div class="bell-icon" onclick="toggleNotifications()">
                🔔 <span class="badge-count" id="notif-count">0</span>
                <div class="notification-dropdown" id="notif-box">
                    <p class="notif-title">NETWORK BROADCASTS</p>
                    <div id="notif-content" style="font-size: 13px; color: #a0aec0; line-height: 1.4;">
                        No global announcements active.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid">
        <!-- Cryptographic Core Operations -->
        <div>
            <!-- Authentication & Identity Gate -->
            <div class="card" id="auth-gate-box">
                <h3>Identity Gate</h3>
                <button onclick="generateUserIdentity()">Generate Cryptographic Identity</button>
                
                <div id="key-display" style="display:none; background:#07090c; padding:12px; margin:10px 0; word-break:break-all; font-size:11px; border: 1px dashed var(--primary); border-radius: 6px; font-family: monospace;">
                    <span style="color:var(--primary); font-weight: bold;">YOUR SECRET MASTER KEY (Save immediately):</span><br>
                    <span id="generated-private-key" style="color: #ff9500;"></span>
                </div>
                
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
                
                <input type="text" id="login-key-input" placeholder="Paste your Private Key here...">
                <button class="btn-secondary" onclick="loginWithSingleKey()">Authenticate Session</button>
            </div>

            <!-- Global Node Router -->
            <div class="card">
                <h3>Directory Router</h3>
                <input type="text" id="search-user-id" placeholder="Enter peer ID...">
                <button onclick="followUser()">Link & Follow Peer</button>
            </div>

            <!-- End-to-End Encrypted Tunnel -->
            <div class="card">
                <h3>Encrypted Channel (P2P / Group)</h3>
                <input type="text" id="chat-target" placeholder="Recipient or Channel ID...">
                <div class="chat-box" id="chat-messages">
                    <div class="msg" style="color: #718096; text-align: center; border: none; background: transparent;">Secure tunnel active. E2EE validated.</div>
                </div>
                <textarea id="chat-msg" rows="2" placeholder="Write private message..."></textarea>
                <button onclick="sendSecureMessage()">Send Encrypted Payload</button>
            </div>
        </div>

        <!-- Public Timeline Feed Subsystem -->
        <div>
            <!-- Privileged Operational Control Terminal (Visible only to Admin Key) -->
            <div class="card" id="admin-broadcast-box" style="display: none; border: 1px solid var(--admin-color);">
                <h3 style="color: var(--admin-color);">Network Admin Broadcast Terminal</h3>
                <textarea id="announcement-input" rows="2" placeholder="Broadcast system policies, compliance or global directives..."></textarea>
                <button style="background: var(--admin-color); color: #000;" onclick="sendAdminNotification()">Publish Global Directive</button>
            </div>

            <!-- Content Creation Node -->
            <div class="card">
                <h3>Publish Node Payload</h3>
                <textarea id="post-text" rows="3" placeholder="Share decentralized thoughts or intelligence..."></textarea>
                <button onclick="submitPost()">Publish to Timeline</button>
            </div>

            <!-- Real-Time Decentralized Timeline Feed -->
            <div id="timeline-feed">
                <!-- Clean slate. Dynamically generated user logs load here -->
            </div>
        </div>
    </div>
</div>

<script>
// ====================================================================
// ⚙️ INTERNAL NETWORK CONFIGURATION [ENCRYPTED ROOT SYSTEM]
// ====================================================================
const MY_CHOSEN_ADMIN_ID = "55555"; 
const MY_SECRET_ADMIN_KEY = "ADMIN-ID-55555-vO1$SgH#aEaM!iL9*aX_Z7&pQ%3wK@8bN4jH~tC2mK9pLqW5zX7rY1tN4bV8cX9mQ2nW4bV7cX9mQ2nW4bV7cX9mQ2n_vO1$SgH#aEaM!iL9*aX_Z7&pQ%3wK@8bN4jH~tC2mK9pLqW5zX7rY1tN4bV8cX9mQ2nW4bV7cX9mQ2nW4bV7cX9mQ2n_vO1$SgH#aEaM!iL9"; 
// ====================================================================

let currentUser = null;

// Generation Module: Creates standard 10-digit ID appended to a 200+ char crypto core
function generateUserIdentity() {
    const tenDigitId = Math.floor(1000000000 + Math.random() * 9000000000).toString();
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
    
    let cryptoBuffer = "";
    for (let i = 0; i < 185; i++) {
        cryptoBuffer += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    const finalUserKey = `USER-ID-${tenDigitId}-${cryptoBuffer}`;
    
    document.getElementById('generated-private-key').innerText = finalUserKey;
    document.getElementById('key-display').style.display = 'block';
}

// Session Authentication Processor
function loginWithSingleKey() {
    const inputKey = document.getElementById('login-key-input').value.trim();
    if(!inputKey) return alert("Error: Private crypt-key string input is blank!");

    // Admin Verification Routine
    if (inputKey === MY_SECRET_ADMIN_KEY) {
        currentUser = { id: MY_CHOSEN_ADMIN_ID, role: 'admin' };
        document.getElementById('admin-broadcast-box').style.display = 'block';
    } 
    // Standard User Extract Routine
    else if (inputKey.startsWith("USER-ID-")) {
        const parts = inputKey.split("-");
        const extractedId = parts[2]; 
        
        currentUser = { id: extractedId, role: 'user' };
        document.getElementById('admin-broadcast-box').style.display = 'none';
    } else {
        return alert("Authentication Failure: Invalid cryptographic key sequence.");
    }

    // UI Transformation - Clean UI Execution
    document.getElementById('auth-gate-box').style.display = 'none';
    document.getElementById('logout-action-btn').style.display = 'inline-block';
    updateUIState();
}

// Session Expiry & Log Out Implementation
function logoutSession() {
    currentUser = null;
    document.getElementById('auth-gate-box').style.display = 'block';
    document.getElementById('logout-action-btn').style.display = 'none';
    document.getElementById('admin-broadcast-box').style.display = 'none';
    document.getElementById('login-key-input').value = '';
    document.getElementById('key-display').style.display = 'none';
    
    document.getElementById('user-status-container').innerHTML = `<span class="user-badge" style="color: #718096;">Session Locked</span>`;
    
    // Hide all delete actions on active cards
    document.querySelectorAll('.delete-btn').forEach(el => el.style.display = 'none');
}

// Context Sync Module
function updateUIState() {
    if(!currentUser) return;
    
    let statusHtml = `ID: <span class="user-badge">${currentUser.id}</span>`;
    
    if(currentUser.role === 'admin') {
        statusHtml += `<span class="admin-badge">ADMIN</span>`;
        document.querySelectorAll('.delete-btn').forEach(el => el.style.display = 'inline-block');
    }
    document.getElementById('user-status-container').innerHTML = statusHtml;
}

// Moderation Subsystem execution
function deletePost(postId) {
    if(currentUser && currentUser.role === 'admin') {
        if(confirm("Confirm action: Execute permanent purge of this content node?")) {
            document.getElementById(postId).remove();
        }
    } else {
        alert("Operation Refused: Privileged root access required.");
    }
}

// Admin Broadcast Controller
function sendAdminNotification() {
    const text = document.getElementById('announcement-input').value.trim();
    if(!text) return;
    
    if(currentUser && currentUser.role === 'admin') {
        document.getElementById('notif-content').innerText = text;
        const countBadge = document.getElementById('notif-count');
        countBadge.innerText = "1";
        countBadge.style.display = "block";
        document.getElementById('announcement-input').value = '';
    }
}

// Toggle Dropdown Display Panel
function toggleNotifications() {
    const box = document.getElementById('notif-box');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
    if(box.style.display === 'block') {
        document.getElementById('notif-count').style.display = 'none';
    }
}

// Distributed Post Generation System
function submitPost() {
    const text = document.getElementById('post-text').value.trim();
    if(!text) return;
    if(!currentUser) return alert("System Error: Session required to sign and push payload data.");
    
    const feed = document.getElementById('timeline-feed');
    const uniquePostId = 'node_' + Date.now();
    
    const postCard = document.createElement('div');
    postCard.className = 'card';
    postCard.id = uniquePostId;
    
    let adminLabel = currentUser.role === 'admin' ? '<span class="admin-badge">ADMIN</span>' : '';
    let delBtnDisplay = currentUser.role === 'admin' ? 'inline-block' : 'none';

    postCard.innerHTML = `
        <button class="delete-btn" style="display:${delBtnDisplay};" onclick="deletePost('${uniquePostId}')">Purge</button>
        <strong>ID: ${currentUser.id}</strong> ${adminLabel}
        <p style="margin: 15px 0 0 0; line-height: 1.5; color: #e2e8f0;">${text}</p>
    `;
    
    feed.insertBefore(postCard, feed.firstChild);
    document.getElementById('post-text').value = '';
}

// Node Directory Linkage Interaction Logic
function followUser() {
    const targetId = document.getElementById('search-user-id').value.trim();
    if(!currentUser) return alert("Network Error: Initialize active session first.");
    if(!targetId) return alert("Input required.");
    if(targetId === currentUser.id) return alert("Loop Exception: Self-referential links are invalid.");
    
    alert(`Success: Static route linked to Peer Node ID ${targetId}`);
    document.getElementById('search-user-id').value = '';
}

// Cryptographic Transport Simulator Box
async function sendSecureMessage() {
    const target = document.getElementById('chat-target').value.trim();
    const msg = document.getElementById('chat-msg').value.trim();
    if(!currentUser) return alert("Network Error: Active session missing.");
    if(!target || !msg) return alert("Field execution mismatch: Recipient and payload string required.");
    
    const chatBox = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg';
    msgDiv.style.borderLeft = "2px solid var(--primary)";
    msgDiv.innerHTML = `<b>You:</b> ${msg} <span class="msg-meta">[Encrypted via AES-GCM P2P Tunnel]</span>`;
    
    chatBox.appendChild(msgDiv);
    document.getElementById('chat-msg').value = '';
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
